<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo de test — Rediseño de Bumble</title>
<style>
  :root{
    --ink:#141414; --muted:#6b6b6b; --line:#141414; --line-soft:#d9d9d9;
    --gray-fill:#e2e2e2; --gray-row:#f2f2f2; --chrome:#f4f4f4; --white:#fff;
    --warn:#c0392b; --ok:#1a7a4c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#eceae6; color:var(--ink); min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer;}

  /* ===== TOOL CHROME ===== */
  .chrome{
    background:var(--chrome); border-bottom:1px solid var(--line-soft);
    padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:50;
  }
  .chrome-left{font-size:13px; color:var(--muted);}
  .chrome-left strong{color:var(--ink); display:block; font-size:14px; margin-bottom:2px;}
  .chrome-right{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .chip-timer{
    font-family:'Courier New', monospace; font-size:12.5px; background:#fff; border:1px solid var(--line-soft);
    padding:6px 12px; border-radius:100px; color:var(--muted);
  }
  .btn-chrome{
    border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 16px;
    border-radius:100px; font-size:12.5px; font-weight:600;
  }
  .btn-chrome:hover{background:var(--ink); color:#fff;}
  .btn-chrome.danger{border-color:var(--warn); color:var(--warn);}
  .btn-chrome.danger:hover{background:var(--warn); color:#fff;}
  .btn-chrome:disabled{opacity:.4; cursor:not-allowed; pointer-events:none;}

  /* ===== STAGE ===== */
  .stage{display:flex; justify-content:center; padding:40px 16px 90px;}
  .device{
    width:100%; max-width:360px; background:#fff; border:1.5px solid var(--line);
    border-radius:26px; height:680px; position:relative; overflow-y:auto; overflow-x:hidden;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.25);
  }
  .screen{padding:24px 20px 20px; min-height:680px; position:relative; box-sizing:border-box;}
  .scr-center{padding-top:110px; text-align:center;}
  .has-bottom-bar{padding-bottom:86px;}

  /* ===== GENERIC UI ===== */
  .topbar{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
  .topbar .back{font-size:22px; line-height:1; padding:4px 8px; border-radius:6px;}
  .topbar .back:hover{background:var(--gray-row);}
  .topbar h2{font-size:19px; font-weight:700;}

  .avatar-lg{
    width:150px; height:150px; border-radius:50%; background:var(--gray-fill); margin:0 auto 18px;
    position:relative;
  }
  .avatar-lg::after{
    content:''; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:110%; height:52%; background:var(--gray-fill); border-radius:50% 50% 0 0/60% 60% 0 0;
  }
  .avatar-lg::before{
    content:''; position:absolute; top:22%; left:50%; transform:translateX(-50%);
    width:46%; height:46%; border-radius:50%; background:#cfcfcf;
  }

  .btn-black{
    width:100%; background:var(--ink); color:#fff; border:none; padding:16px; border-radius:10px;
    font-size:15.5px; font-weight:600; text-align:center;
  }
  .btn-black:hover{opacity:.9;}
  .btn-text-link{
    display:block; text-align:center; margin-top:16px; font-size:14px; color:var(--ink); background:none; border:none;
  }

  .field-box{border:1.5px solid var(--line); border-radius:12px; padding:16px; margin-bottom:18px;}
  .field-box h4{font-size:14.5px; font-weight:600; margin-bottom:4px;}
  .field-box .hint{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
  .field-row{
    background:var(--gray-row); border-radius:8px; padding:12px 14px; font-size:14px; margin-bottom:8px;
  }
  .field-row:last-child{margin-bottom:0;}
  .field-row.empty{color:var(--muted); font-style:italic; display:flex; align-items:center; justify-content:space-between;}

  .plan-checklist{margin:16px 0;}
  .plan-item{
    border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14.5px;
  }
  .plan-item.selected{background:var(--ink); color:#fff;}
  .checkbox{
    width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .plan-item.selected .checkbox{background:#fff; color:var(--ink); border-color:#fff;}
  .plan-item.special{border-style:dashed;}

  .continue-fab{
    width:56px; height:56px; border-radius:50%; background:var(--gray-fill); border:none;
    display:flex; align-items:center; justify-content:center; font-size:20px; margin-left:auto; margin-top:12px;
  }
  .continue-fab.active{background:var(--ink); color:#fff;}
  .continue-fab:disabled{cursor:not-allowed;}

  /* ===== DISCOVER / PERFIL SCREEN ===== */
  .header-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .header-row .logo{font-size:26px; font-weight:800;}
  .filter-icon{width:26px; height:26px; opacity:.7;}
  .card-outer{border:1.5px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px;}
  .match-banner{background:var(--gray-row); border-radius:10px; padding:14px 16px; margin-bottom:18px;}
  .match-banner .lbl{font-size:14px; margin-bottom:4px;}
  .match-banner .val{font-size:14.5px; font-style:italic;}
  .card-photo{
    width:190px; height:190px; border-radius:50%; background:var(--gray-fill); margin:0 auto 22px; position:relative;
  }
  .card-photo::before{
    content:''; position:absolute; top:24%; left:50%; transform:translateX(-50%);
    width:42%; height:42%; border-radius:50%; background:#cfcfcf;
  }
  .card-photo::after{
    content:''; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:100%; height:48%; background:var(--gray-fill); border-radius:50% 50% 0 0/60% 60% 0 0;
  }
  .name-row{display:flex; justify-content:space-between; align-items:center;}
  .name-row .name{font-size:24px; font-weight:700;}
  .star-sm{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .star-lg{
    width:70px; height:70px; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:30px; background:#fff;
  }
  .star-lg:hover{background:var(--gray-row);}

  .bio-box{margin-top:18px;}
  .bio-box h4{font-weight:700; font-size:15px; margin-bottom:8px;}
  .bio-box p{font-size:14.5px; margin-bottom:12px;}
  .bio-box hr{border:none; border-top:1px solid var(--line-soft); margin:12px 0;}
  .signal-row{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted);}

  /* ===== PROFILE: PLAIN SECTIONS, TAGS, EXTRA PHOTOS ===== */
  .plain-section{margin:0 0 22px;}
  .plain-section h4{font-weight:700; font-size:15.5px; margin-bottom:10px;}
  .tags-row{display:flex; flex-wrap:wrap; gap:9px;}
  .tag-pill{
    background:var(--gray-row); border-radius:100px; padding:8px 14px; font-size:13px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .block-photo{
    border:1.5px solid var(--line); border-radius:14px; padding:26px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:center;
  }
  .block-photo .card-photo{margin:0;}

  /* ===== SWIPE CARD ===== */
  .swipe-card{position:relative; touch-action:pan-y; user-select:none;}
  .swipe-flag{
    position:absolute; top:26px; z-index:5; border:3px solid; border-radius:8px; padding:6px 14px;
    font-weight:800; font-size:18px; letter-spacing:.05em; text-transform:uppercase; opacity:0; transform:rotate(-12deg);
    pointer-events:none;
  }
  .swipe-flag.like{left:20px; color:var(--ok); border-color:var(--ok);}
  .swipe-flag.dislike{right:20px; color:var(--warn); border-color:var(--warn); transform:rotate(12deg);}

  .decide-row{display:flex; flex-direction:column; align-items:center; gap:18px; margin:14px 0 6px;}
  .decide-row .action-row{display:flex; gap:26px;}
  .action-btn{
    width:58px; height:58px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .action-btn:hover{background:var(--gray-row);}
  .action-btn.like-btn{width:64px; height:64px; font-size:26px;}
  .link-row{text-align:center; margin-top:16px; font-size:13.5px;}
  .link-row .block-link{display:block; color:var(--muted); margin-bottom:8px; background:none; border:none; font-size:13.5px;}
  .link-row .report-link{color:var(--warn); background:none; border:none; font-size:13.5px;}

  /* ===== BOTTOM NAV ===== */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0; border-top:1.5px solid var(--line); background:#fff;
    display:flex; justify-content:space-around; padding:14px 8px 16px;
  }
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--muted); background:none; border:none;}
  .nav-item .dot{width:32px; height:32px; border-radius:50%; background:var(--gray-fill);}
  .nav-item.active{color:var(--ink); font-weight:700;}
  .nav-item.active .dot{background:var(--ink);}

  /* ===== MATCH SCREEN ===== */
  .match-x{font-size:22px; margin-bottom:40px; display:inline-block;}
  .match-cards{position:relative; height:170px; display:flex; align-items:center; justify-content:center; margin-bottom:26px;}
  .match-card{
    width:120px; height:120px; border:2px solid var(--line); border-radius:14px; background:#fff;
    display:flex; align-items:center; justify-content:center; position:absolute;
  }
  .match-card .ph-circ{width:52px; height:52px; border-radius:50%; background:var(--gray-fill); position:relative;}
  .match-card .ph-circ::after{content:'';position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:70px;height:34px;background:var(--gray-fill);border-radius:50% 50% 0 0/70% 70% 0 0;}
  .match-card.left{transform:rotate(-8deg); left:calc(50% - 110px);}
  .match-card.right{transform:rotate(8deg); left:calc(50% - 10px);}
  .match-star{
    width:76px; height:76px; border-radius:50%; border:1.5px solid var(--line-soft); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:32px; color:#cfcfcf; z-index:2;
  }
  .match-msg{font-size:15px; margin-bottom:24px;}

  /* ===== CHAT SCREEN ===== */
  .persp-toggle{display:flex; gap:8px; margin-bottom:18px;}
  .persp-btn{
    flex:1; border:1.5px solid var(--line); background:#fff; padding:9px; border-radius:8px; font-size:12.5px; font-weight:600;
  }
  .persp-btn.active{background:var(--ink); color:#fff;}
  .persp-btn.pablo.active{background:#4A5FE8; border-color:#4A5FE8;}
  .persp-btn.sara.active{background:#FF6B5C; border-color:#FF6B5C;}
  .chat-banner{border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:22px;}
  .chat-banner .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .chat-banner .b-title{font-weight:700; font-size:14.5px; margin-bottom:4px;}
  .chat-banner .b-sub{font-size:13px; color:var(--muted);}
  .chat-banner .b-cta{font-weight:700; font-size:13.5px; white-space:nowrap; background:none; border:none; flex-shrink:0;}
  .chat-banner.celebrate{background:var(--gray-row);}
  .convo-bubble{
    border:1.5px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; max-width:78%;
    color:var(--muted); font-size:13px;
  }
  .convo-bubble.right{margin-left:auto;}
  .chat-inputbar{
    display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:100px;
    padding:8px 10px; position:absolute; left:20px; right:20px; bottom:20px; background:#fff;
  }
  .chat-inputbar .circ{width:34px; height:34px; border-radius:50%; background:var(--gray-fill); flex-shrink:0;}
  .chat-inputbar input{flex:1; border:none; outline:none; font-size:14px; font-family:inherit; background:none;}

  /* radio-style single select (plan picker) */
  .plan-item.radio .checkbox{border-radius:50%;}
  .plan-item.radio.selected .checkbox{background:#fff; border-color:var(--line); color:var(--ink);}
  .plan-item.radio .checkbox .dotfill{width:11px; height:11px; border-radius:50%; background:var(--line);}

  /* simple confirmation modal */
  .confirm-icon-box{background:var(--gray-row); border-radius:10px; padding:24px 18px; text-align:center; margin:16px 0 20px;}
  .confirm-icon-box .circ{width:56px; height:56px; border-radius:50%; background:var(--gray-fill); margin:0 auto 14px;}
  .confirm-icon-box p{font-size:14.5px; line-height:1.5;}


  .modal-backdrop{
    position:absolute; inset:0; background:rgba(20,20,20,.55); z-index:40; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    background:#fff; width:100%; border-radius:20px 20px 0 0; padding:24px 22px 26px;
    max-height:88%; overflow-y:auto; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-sheet h3{font-size:18px; font-weight:700; margin-bottom:4px;}
  .modal-sheet .hint{font-size:13px; color:var(--muted); margin-bottom:16px;}

  /* ===== TOAST ===== */
  .toast{
    position:absolute; left:50%; bottom:100px; transform:translate(-50%,10px); background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:100px; font-size:13.5px; opacity:0; pointer-events:none; z-index:60;
    transition:all .25s ease; text-align:center; white-space:nowrap; max-width:88%;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* ===== GATE / SUMMARY / SESSIONS ===== */
  .panel{max-width:520px; margin:0 auto; background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:34px 30px;}
  .panel h2{font-size:22px; font-weight:700; margin-bottom:10px;}
  .panel p{font-size:14.5px; color:var(--muted); margin-bottom:18px; line-height:1.5;}
  .panel input{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; font-size:14.5px; margin-bottom:16px;
  }
  .stat-row{display:flex; gap:12px; margin:18px 0; flex-wrap:wrap;}
  .stat-card{flex:1; min-width:120px; border:1px solid var(--line-soft); border-radius:10px; padding:14px; text-align:center;}
  .stat-card .num{font-size:24px; font-weight:700;}
  .stat-card .lbl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:4px;}
  .path-trail{font-size:13.5px; color:var(--ink); line-height:1.8; margin:14px 0;}
  .path-trail b{background:var(--gray-row); padding:2px 8px; border-radius:100px; font-weight:600;}

  .session-card{border:1px solid var(--line-soft); border-radius:12px; padding:16px 18px; margin-bottom:12px;}
  .session-card .sc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .session-card .sc-name{font-weight:700; font-size:15px;}
  .session-card .sc-date{font-size:12px; color:var(--muted);}
  .session-card .sc-meta{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  .session-card .sc-meta b{color:var(--ink);}
  .session-card details summary{cursor:pointer; font-size:12.5px; color:var(--ink); font-weight:600; margin-top:6px;}
  .event-log{margin-top:10px; font-family:'Courier New', monospace; font-size:11.5px; max-height:220px; overflow-y:auto; background:var(--gray-row); border-radius:8px; padding:10px 12px;}
  .event-log div{padding:3px 0; border-bottom:1px solid #e6e6e6;}
  .event-log div:last-child{border-bottom:none;}
  .ev-dead{color:var(--warn);}
  .ev-inert{color:#946200;}
  .ev-action{color:var(--ok);}
  .ev-nav{color:#555;}

  .empty-state{text-align:center; color:var(--muted); font-size:14px; padding:40px 0;}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-left" id="chromeLeft">
    <strong>Prototipo de test — Rediseño de Bumble</strong>
    <span id="chromeSub">Sin test activo</span>
  </div>
  <div class="chrome-right">
    <span class="chip-timer" id="timerChip" style="display:none;">00:00</span>
    <button class="btn-chrome" id="btnSessions">Sesiones guardadas</button>
    <button class="btn-chrome" id="btnReset" style="display:none;">&#8635; Reiniciar</button>
    <button class="btn-chrome danger" id="btnFinish" style="display:none;">Finalizar test</button>
  </div>
</div>

<div class="stage">
  <div class="device" id="device">
    <div class="screen" id="screen"></div>
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-sheet" id="modalSheet"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PLAN_OPTIONS = [
    "Tomar algo (café o copas)",
    "Dar un paseo",
    "Plan al aire libre (parque, playa, naturaleza)",
    "Plan cultural (museo, expo, cine)",
    "Comer o cenar juntos",
    "Plan activo (deporte, clase, actividad física)",
    "Concierto o evento en directo",
    "Juegos o algo random (bolera, arcade, escape room)"
  ];
  var SPECIAL = "Aún no lo sé, sorpréndeme";
  var SARA_PLANS = ["Dar un paseo", "Tomar algo (café o copas)"];
  var STORAGE_KEY = "bumble_usability_sessions_v1";

  var state = {
    view: "gate",           // gate | app | summary | sessions
    screen: "persona",       // persona | inicio | onboarding | perfilSelf | editarPerfil | discover | match | chat
    plans: [],
    modal: null,             // null | "editPlans" | "confirmIntent" | "pickPlan" | "proposedConfirm" | "saraResponse" | "saraPickPlan" | "saraConfirmYes" | "saraCounterConfirm" | "saraDeclineConfirm" | "pabloCounterResponse"
    modalDraft: [],
    discoverDecided: false,
    perspective: "pablo",     // pablo | sara
    proposedPlan: null,
    saraHasProposal: false,
    saraDecision: null,       // null | "yes" | "counter" | "no"
    lastCounterOffer: null,
    mutualConfirmed: false,
    pabloDeclinedCounter: false,
    pickPlanChoice: null,
    saraPickChoice: null
  };
  var suppressNextClick = false;

  var session = null;       // active session object
  var timerInterval = null;

  // ---------- UTIL ----------
  function el(html){
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function joinEs(arr){
    if(arr.length === 0) return "";
    if(arr.length === 1) return arr[0];
    if(arr.length === 2) return arr[0] + " y " + arr[1];
    return arr.slice(0,-1).join(", ") + " y " + arr[arr.length-1];
  }
  function fmtTime(ms){
    var s = Math.floor(ms/1000);
    var m = Math.floor(s/60);
    s = s % 60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'2-digit'}) + " · " +
           d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  }

  // ---------- SESSION / TRACKING ----------
  function startSession(tester){
    session = {
      tester: tester && tester.trim() ? tester.trim() : "Anónimo",
      startTime: Date.now(),
      events: []
    };
    state.view = "app";
    state.screen = "persona";
    state.plans = [];
    logEvent('nav', {label:'Inicio de test'});
    render();
    startTimer();
  }

  function logEvent(type, detail){
    if(!session) return;
    session.events.push({
      t: Date.now() - session.startTime,
      type: type,
      screen: state.screen,
      detail: detail || {}
    });
  }

  function changeScreen(newScreen){
    logEvent('nav', {label:'Pantalla: ' + screenLabel(newScreen)});
    state.screen = newScreen;
    render();
  }

  function screenLabel(s){
    return {
      persona:"Presentación", inicio:"Inicio", onboarding:"Onboarding (planes)", perfilSelf:"Mi perfil",
      editarPerfil:"Editar perfil", discover:"Descubrir gente", match:"Match", chat:"Chat"
    }[s] || s;
  }

  function startTimer(){
    document.getElementById('timerChip').style.display = 'inline-block';
    document.getElementById('btnFinish').style.display = 'inline-block';
    document.getElementById('btnReset').style.display = 'inline-block';
    timerInterval = setInterval(function(){
      if(!session) return;
      document.getElementById('timerChip').textContent = fmtTime(Date.now() - session.startTime);
    }, 1000);
  }
  function stopTimer(){
    clearInterval(timerInterval);
    document.getElementById('timerChip').style.display = 'none';
    document.getElementById('btnFinish').style.display = 'none';
    document.getElementById('btnReset').style.display = 'none';
  }

  function finishSession(){
    if(!session) return;
    logEvent('nav', {label:'Fin de test'});
    var duration = Date.now() - session.startTime;
    var path = session.events.filter(function(e){return e.type==='nav';}).map(function(e){return e.detail.label;});
    var deadClicks = session.events.filter(function(e){return e.type==='dead';});
    var inertClicks = session.events.filter(function(e){return e.type==='inert';});
    var actions = session.events.filter(function(e){return e.type==='action';});

    var record = {
      id: 's_' + Date.now(),
      tester: session.tester,
      startTime: session.startTime,
      duration: duration,
      path: path,
      deadCount: deadClicks.length,
      inertCount: inertClicks.length,
      actionCount: actions.length,
      events: session.events
    };
    saveSession(record);
    stopTimer();
    state.view = "summary";
    state.lastRecord = record;
    session = null;
    render();
  }

  function saveSession(record){
    var all = loadSessions();
    all.unshift(record);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }
  function loadSessions(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){ return []; }
  }
  function clearSessions(){
    if(confirm("¿Borrar todas las sesiones guardadas? Esto no se puede deshacer.")){
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  }

    var t = document.getElementById('toast');

  // ---------- CLICK TRACKING (delegated) ----------
  document.getElementById('device').addEventListener('click', function(e){
    if(state.view !== 'app') return;

    var trackEl = e.target.closest('[data-track]');
    var rect = document.getElementById('device').getBoundingClientRect();
    var x = Math.round(e.clientX - rect.left);
    var y = Math.round(e.clientY - rect.top);

    if(trackEl){
      var isInert = trackEl.getAttribute('data-inert') === 'true';
      logEvent(isInert ? 'inert' : 'action', {label: trackEl.getAttribute('data-track'), x:x, y:y});
    } else {

  function attachSwipeHandlers(cardEl){
    var dragging = false, intent = null, startX = 0, startY = 0, dx = 0;
    var THRESHOLD = 110;

    cardEl.addEventListener('pointerdown', function(e){
      dragging = true; intent = null; startX = e.clientX; startY = e.clientY; dx = 0;
      cardEl.style.transition = 'none';
    });

    cardEl.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var ddx = e.clientX - startX;
      var ddy = e.clientY - startY;
      if(intent === null){
        if(Math.abs(ddx) < 6 && Math.abs(ddy) < 6) return;
        intent = Math.abs(ddx) > Math.abs(ddy) ? 'horizontal' : 'vertical';
        if(intent === 'horizontal'){ try{ cardEl.setPointerCapture(e.pointerId); }catch(err){} }
      }
      if(intent !== 'horizontal') return;
      e.preventDefault();
      dx = ddx;
      var rot = dx / 18;
      cardEl.style.transform = 'translateX(' + dx + 'px) rotate(' + rot + 'deg)';
      var likeFlag = cardEl.querySelector('.swipe-flag.like');
      var dislikeFlag = cardEl.querySelector('.swipe-flag.dislike');
      likeFlag.style.opacity = Math.max(0, Math.min(1, dx / THRESHOLD));
      dislikeFlag.style.opacity = Math.max(0, Math.min(1, -dx / THRESHOLD));
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      if(intent !== 'horizontal'){ intent = null; return; }
      suppressNextClick = true;
      cardEl.style.transition = 'transform .28s ease';
      if(dx > THRESHOLD){
        cardEl.style.transform = 'translateX(600px) rotate(24deg)';
        setTimeout(function(){ handleDecision('like'); }, 180);
      } else if(dx < -THRESHOLD){
        cardEl.style.transform = 'translateX(-600px) rotate(-24deg)';
        setTimeout(function(){ handleDecision('dislike'); }, 180);
      } else {
        cardEl.style.transform = 'translateX(0) rotate(0)';
        var likeFlag = cardEl.querySelector('.swipe-flag.like');
        var dislikeFlag = cardEl.querySelector('.swipe-flag.dislike');
        if(likeFlag) likeFlag.style.opacity = 0;
        if(dislikeFlag) dislikeFlag.style.opacity = 0;
      }
      intent = null;
    }
    cardEl.addEventListener('pointerup', endDrag);
    cardEl.addEventListener('pointercancel', endDrag);
  }

  document.getElementById('btnReset').onclick = resetAppState;
  document.getElementById('btnSessions').onclick = function(){
    if(session && !confirm("Tienes un test en curso. Si sales ahora se perderá sin guardarse. ¿Continuar?")) return;
    if(session){ stopTimer(); session = null; }
    state.view = 'sessions';
    render();
  };

  render();
})();
</script>

</body>
</html>
