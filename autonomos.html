<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autónomos — Próximamente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="light"]{
    --bg:#FAFAFC; --dot:#E4E4EC; --ink:#15161A; --muted:#63636D; --line:#E4E4EA;
    --accent:#4A5FE8; --accent-soft:#EDEFFC; --card:#FFFFFF; color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#151318; --dot:#26212F; --ink:#F4F2ED; --muted:#B7B2C4; --line:#2E2A38;
    --accent:#8B85F8; --accent-soft:#262242; --card:#1D1A24; color-scheme:dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(var(--dot) 1px, transparent 1px) 0 0/24px 24px, var(--bg);
    color:var(--ink); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    max-width:820px; margin:0 auto; width:100%; padding:26px 24px; font-family:'IBM Plex Mono', monospace; font-size:13px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header a{color:var(--muted); text-decoration:none;}
  header a:hover{color:var(--ink);}
  .theme-toggle{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; transition:.2s ease; padding:0;
  }
  .theme-toggle:hover{border-color:var(--accent); color:var(--accent);}
  .theme-toggle svg{display:block;}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle .icon-moon{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:block;}
  [data-theme="light"] .theme-toggle .icon-moon{display:block;}
  main{max-width:820px; margin:auto; padding:24px; text-align:center;}
  .tag{display:inline-flex; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--accent); background:var(--accent-soft); padding:5px 12px; border-radius:100px; margin-bottom:20px;}
  h1{font-family:'Space Grotesk', sans-serif; font-size:clamp(26px,4vw,36px);}
  p{color:var(--muted); margin-top:14px; max-width:50ch; margin-left:auto; margin-right:auto;}
</style>
<script>
  (function(){
    var saved = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
</head>
<body>
<header>
  <a href="index.html">← Volver</a>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo claro">
    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>
<main>
  <span class="tag">Próximamente</span>
  <h1>Herramienta para autónomos en construcción</h1>
  <p>Este proyecto 0→1 todavía está en definición: problema, usuario y propuesta de valor. Vuelve pronto.</p>
</main>
<script>
(function(){
  var toggle = document.getElementById('themeToggle');
  if(!toggle) return;
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    toggle.setAttribute('aria-label', theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
    localStorage.setItem('theme', theme);
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  toggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
